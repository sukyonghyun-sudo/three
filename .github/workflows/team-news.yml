name: team-news
# 오늘의 뉴스 TV: 20분마다 다섯 분야 뉴스 제목을 모아 team-news 가지에 news.json 하나로 올린다 (기록 없이 덮어씀)
# 페이지는 https://raw.githubusercontent.com/sukyonghyun-sudo/three/team-news/news.json 을 읽는다
on:
  schedule:
    - cron: "4,24,44 * * * *"
  workflow_dispatch:
  push: # 저장소에 무엇이든 올라오면 한 번 더 (GitHub 예약 실행이 늦거나 안 돌 때 대비)
    branches: [main]
permissions:
  contents: write
concurrency:
  group: team-news
  cancel-in-progress: true
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fetch
        run: |
          curl -sSf "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/team-news/fetch_news.py" -o fetch_news.py
          python3 fetch_news.py news.json
      - name: publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && mv news.json out/ && cd out
          git init -q -b team-news
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -q -m "news $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" team-news
