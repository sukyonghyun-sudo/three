<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="app/icon-192.png">
<link rel="apple-touch-icon" href="app/apple-touch-icon.png">
<meta name="theme-color" content="#f2f2f7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우리팀 테스트">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>우리팀</title>
<style>
:root{--bg:#ece5da;--panel:#fffdf9;--ink:#23252a;--muted:#70737a;--line:#e5ded3;--work:#2f9e62;--move:#d08a1e;--away:#a3a7ad}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:minmax(0,1fr) 300px;position:fixed;inset:0} /* 높이를 계산하지 않고 화면 네 끝에 붙인다 — 아이폰 설치 앱·주소창·홈 막대 때문에 100vh/100dvh 가 모자라 아래가 하얗게 비던 것 */
html,body{overscroll-behavior:none}
#stage{position:relative;min-width:0;overflow:hidden}
#stage canvas{display:block;cursor:grab}
#stage canvas:active{cursor:grabbing}
#stage canvas.uilayer{position:absolute;left:0;top:0;pointer-events:none;cursor:default}
.hud{position:absolute;left:16px;top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hud h1{margin:0;font-size:18px;font-weight:700}
.counts{display:flex;gap:6px;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,253,249,.92);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--away);flex:none}
.dot.work{background:var(--work)}.dot.move{background:var(--move)}
.styles{display:flex;gap:4px;background:rgba(255,253,249,.92);border:1px solid var(--line);border-radius:10px;padding:3px}
.styles a{font-size:12px;padding:4px 10px;border-radius:7px;color:var(--ink);text-decoration:none}
.styles a.on{background:var(--ink);color:#fff}
.rep{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,253,249,.92);border:1px solid var(--line);border-radius:10px;padding:5px 10px}
.rep:hover{color:var(--ink)}
.view{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;align-items:center}
#perf{font-size:11px;color:var(--muted);background:rgba(255,253,249,.85);border-radius:7px;padding:4px 8px}
.cams{display:flex;gap:4px;background:rgba(255,253,249,.92);border:1px solid var(--line);border-radius:10px;padding:3px}
.cams button{border:0;background:none;border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
.cams button:hover{background:#f3eee6}
.cams button.on{background:var(--ink);color:#fff}
.note{position:absolute;left:16px;bottom:14px;font-size:12px;color:var(--muted);background:rgba(255,253,249,.9);border:1px solid var(--line);border-radius:9px;padding:6px 10px;max-width:520px;line-height:1.5}
button{font:inherit}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover:not(:disabled){border-color:#c9c0b2}
.btn:disabled{color:#b3b5b9;cursor:default}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
#panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#panel header{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
#panel h2{margin:0 0 10px;font-size:15px}
.all{display:flex;gap:6px}
.switch{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:12px;cursor:pointer;user-select:none}
.switch input{appearance:none;width:32px;height:18px;border-radius:18px;background:#d6d1c8;position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--work)}
.switch input:checked::after{transform:translateX(14px)}
#list{list-style:none;margin:0;padding:6px 8px;overflow:auto;overflow-x:hidden;flex:1}
#list li{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;cursor:pointer}
#list li:hover,#list li.sel{background:#f3eee6}
#list img{width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:50% 40%;background:#efe1d6;flex:none}
.who{flex:1;min-width:0}
.who b{display:block;font-size:13px}
.who span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-top:2px;min-width:0}
.who em{flex:none}
.who small{display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:#1f8f43;font-weight:600} /* 직접 쓴 상태 메시지: 상태 아래 한 줄 */
.who small:empty{display:none}
#list .btn{padding:5px 10px;font-size:12px;min-width:52px}
#list li{flex-wrap:wrap}
#list .acts,#list .more{display:flex;gap:4px;flex-basis:100%;padding-left:46px}
#list .acts[hidden],#list .more[hidden]{display:none}
#list .acts .btn,#list .more .btn{padding:4px 9px;min-width:0;white-space:nowrap}
#list .acts{flex-wrap:nowrap} /* 출근·퇴근·상태 메시지는 한 줄로 */
#list .side{flex:none;display:flex;gap:4px}
#list .side .btn{padding:4px 10px;min-width:0;white-space:nowrap}
#list .btn.on{background:var(--work);border-color:var(--work);color:#fff}
#list .more input{flex:1;width:0;min-width:0;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--panel);color:var(--ink)}
#panel.edit #list .acts,#panel.edit #list .more{display:none}
.mode{margin:8px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
#panel header>.msg{font-size:12px;color:var(--work);margin-top:4px;min-height:0}
#panel header>.msg.warn{color:var(--move)}
.hint{padding:10px 16px 14px;font-size:11px;line-height:1.5;color:var(--muted);border-top:1px solid var(--line)}
/* 자리 지정 */
.seatrow{display:flex;gap:6px;margin-top:10px}
.seatbar{margin-top:12px;padding:10px 12px;border-radius:10px;background:#f3eee6;font-size:12px;line-height:1.5;color:var(--muted)}
.seatbar p{margin:0 0 8px}
.seatbar .msg{margin-top:8px;color:var(--work);min-height:1.5em}
.seatbar .msg.warn{color:var(--move)}
#list select{display:none;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--panel);color:var(--ink);max-width:118px}
#panel.edit #list select{display:block}
#panel.edit #list .btn{display:none}
#panel.edit #list li.sel{background:#fbe9cf}
/* 화면 설정 */
.setrow{display:flex;align-items:center;gap:8px;margin:6px 0;color:var(--ink)}
.setrow>span{width:64px;flex:none;font-size:12px;color:var(--muted)}
.setrow input[type=range]{flex:1;accent-color:var(--work)}
.setrow em{font-style:normal;font-size:11px;width:34px;text-align:right;color:var(--muted)}
.swatches{display:flex;gap:5px}
.swatches button{width:22px;height:22px;border-radius:6px;border:1px solid #cfc7ba;cursor:pointer;padding:0}
.swatches button.on{outline:2px solid var(--ink);outline-offset:1px}
#floorPick{width:26px;height:24px;border:0;padding:0;background:none;cursor:pointer}
/* 내 캐릭터 */

#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 38%,#ffffff 0%,#eef1f4 72%);transition:opacity .9s ease,visibility .9s}
#intro.done{opacity:0;visibility:hidden}
#intro .ttl{text-align:center;transform:translateY(-4vh);animation:ttlIn .9s ease both}
#intro .ilogo{display:block;width:96px;height:96px;margin:0 auto 18px;border-radius:22px;box-shadow:0 10px 30px rgba(40,150,120,.22)}
#intro h1{margin:0;font-size:clamp(34px,6vw,68px);font-weight:800;letter-spacing:-.02em;color:var(--ink)}
#intro p{margin:10px 0 0;font-size:clamp(14px,1.6vw,18px);color:var(--muted);letter-spacing:.3em}
#intro .lwrap{position:absolute;left:50%;bottom:12vh;transform:translateX(-50%);width:min(520px,72vw);text-align:center}
#intro .lbar{height:6px;border-radius:6px;background:#e5e5ea;overflow:hidden}
#intro .lbar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#6fdcb4,#2fb38a);transition:width .35s ease}
#intro #lmsg{display:block;margin-top:10px;font-size:12px;color:var(--muted)}
@keyframes ttlIn{from{opacity:0;transform:translateY(-1vh)}to{opacity:1;transform:translateY(-4vh)}}
#app{transition:opacity .9s ease}
body.loading #app{opacity:0}
.listbtn,.pclose{display:none}
.bgmenu{position:absolute;right:12px;bottom:54px;z-index:9;background:rgba(255,253,249,.97);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.bgmenu[hidden]{display:none}
.bgmenu button{border:0;background:none;border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;text-align:left;cursor:pointer;color:var(--ink);white-space:nowrap}
.bgmenu button:hover{background:#f3eee6}
.bgmenu button.on{background:var(--ink);color:#fff}
/* 배경: 시점 막대와 성질이 달라 따로 단추 (메뉴는 단추 바로 위로 열림) */
.bgwrap{position:relative;flex:none;display:flex;margin-right:4px}
.camwrap{position:relative;display:flex;min-width:0}
.camsbtn,.morebtn{display:none}
.camsbtn{align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,253,249,.95);border-radius:10px;padding:0 12px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink);white-space:nowrap}
.camsbtn::after{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 1.6px 1.6px 0;transform:translateY(-2px) rotate(45deg);opacity:.55;margin-left:2px}
.camwrap.open .camsbtn::after{transform:translateY(2px) rotate(-135deg)}
/* 세로 휴대폰 위쪽 「⋯」 메뉴 */
.hudmore{position:absolute;z-index:9;right:calc(10px + env(safe-area-inset-right));top:calc(54px + env(safe-area-inset-top));min-width:200px;background:rgba(249,249,251,.94);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:.5px solid rgba(0,0,0,.08);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;gap:2px}
.hudmore[hidden]{display:none}
.hudmore button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:9px;padding:10px 12px;font:inherit;font-size:14px;font-weight:500;color:var(--ink);text-align:left;cursor:pointer;min-height:42px}
.hudmore button:active{background:rgba(118,118,128,.14)}
.hudmore .sw{margin-left:auto;width:34px;height:20px;border-radius:20px;background:#e5e5ea;position:relative;flex:none;transition:background .2s}
.hudmore .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .2s}
.hudmore .sw.on{background:var(--work,#34c759)}
.hudmore .sw.on::after{transform:translateX(14px)}
@media (max-width:600px){ /* 세로 휴대폰: 위쪽은 한 줄 — 자주 쓰는 것만, 나머지는 「⋯」 */
  .hud .morebtn{order:99}
  .hud{flex-wrap:nowrap}
  .hud .cx-toggle,.hud .cx-gear,.hud .installbtn,.hud .statsbtn{display:none!important}
  .hud .counts .chip:nth-child(n+2){display:none}
  .hud .morebtn{display:inline-flex;justify-content:center;margin-left:auto}
  .hud .testme>span{display:none}
  .hud .testme select{max-width:76px}
}
.bgwrap .bgmenu{right:auto;left:0;bottom:calc(100% + 8px)}
.bgbtn{display:inline-flex;align-items:center;border:1px solid var(--line);background:rgba(255,253,249,.95);border-radius:10px;padding:0 11px;font-size:12px;cursor:pointer;color:var(--ink);white-space:nowrap}
.testnote{background:#fff4d6;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.55;margin-bottom:10px;color:#6b4f10}
.testme{display:inline-flex;align-items:center;gap:2px;background:#fff4d6;border:1px solid #efd28a;border-radius:10px;padding:3px 4px 3px 9px;font-size:12px;color:#6b4f10}
.testme select{font:inherit;font-size:12px;font-weight:700;border:0;background:none;color:inherit;cursor:pointer}
.testnote details{margin-top:4px}
.testnote summary{cursor:pointer;color:var(--blue,#007aff);font-weight:600;list-style:none}
.testnote summary::-webkit-details-marker{display:none}
.testnote button{border:0;background:none;color:#2f6fe4;font:inherit;font-size:12px;padding:0;cursor:pointer;text-decoration:underline}
.pipph{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);font-size:14px;line-height:1.6}
body.pip{margin:0;height:100vh;overflow:hidden;background:var(--bg)}
body.pip #stage{width:100vw;height:100vh}
body.pip .hud button,body.pip .listbtn,body.pip .bgwrap,body.pip .pinbtn{display:none}
/* 위에 띄운 작은 창: 사무실과 근무 수만 (단추 모양 규칙보다 우선) · 글씨는 3D 화면에 같이 그린다 */
html body.pip .hud>:not(.counts),html body.pip .view,html body.pip .pinbtn,html body.pip canvas.uilayer,html body.pip .sx-toast,html body.pip .cx-banner{display:none!important}
.pinbtn{position:absolute;right:12px;top:12px;z-index:6}
.hud{max-width:calc(100% - 170px)}
/* 휴대폰·좁은 창: 사무실을 화면 가득, 사람 목록은 버튼으로 접고 편다 (세로: 아래에서 올라옴 · 가로: 오른쪽에서 나옴) */
@media (max-width:820px),(max-height:520px){
  #app{grid-template-columns:minmax(0,1fr)}
  #panel{position:absolute;z-index:8;left:0;right:0;bottom:0;height:min(62%,560px);border:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    box-shadow:0 -8px 28px rgba(0,0,0,.16);transform:translateY(104%);visibility:hidden;transition:transform .3s ease,visibility 0s .3s}
  #app.list-open #panel{transform:none;visibility:visible;transition:transform .3s ease}
  #panel header{position:relative;padding:44px 14px 10px}
  #panel header::before{content:"";position:absolute;left:50%;top:8px;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:rgba(60,60,67,.25)}
  .pclose{display:block;position:absolute;right:12px;top:10px;padding:5px 12px;font-size:12.5px}
  .listbtn{display:inline-flex;align-items:center;flex:none;border:1px solid var(--line);background:rgba(255,253,249,.95);border-radius:10px;padding:6px 11px;font-size:12px;cursor:pointer;color:var(--ink)}
  #app.aq-wide .listbtn{display:none}
  .hud{left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));gap:6px 8px;pointer-events:none}
  .hud>*{pointer-events:auto}
  .hud h1{display:none}
  .hud .lbl{display:none} /* 휴대폰: 위쪽 단추·칩은 아이콘·숫자만 */
  .hud{max-width:none}
  .testme select{max-width:84px}
  .chip{padding:3px 8px;font-size:11px}
  .view{left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));pointer-events:none}
  /* 시점 막대: 「🎥 지금 시점」 하나로 접고, 누르면 위로 세로 목록 */
  .camwrap{margin-left:auto}
  .camsbtn{display:inline-flex}
  .camwrap .cams{display:none}
  .camwrap.open .cams{display:flex;position:absolute;right:0;bottom:calc(100% + 8px);flex-direction:column;gap:2px;padding:6px;min-width:150px;overflow:visible;z-index:9}
  .camwrap.open .cams button{text-align:left;padding:9px 12px;font-size:13.5px}
  #panel{padding-bottom:env(safe-area-inset-bottom);bottom:var(--kb,0px)} /* --kb: 아이폰 키보드 높이 (입력칸이 가리지 않게) */
  .view>*{pointer-events:auto}
  .cams{min-width:0;margin-left:auto;overflow-x:auto;scrollbar-width:none}
  .cams::-webkit-scrollbar{display:none}
  .cams button{flex:none;padding:5px 9px}
}
@media (max-width:820px) and (orientation:landscape),(max-height:520px) and (orientation:landscape){
  #panel{left:auto;top:0;height:auto;width:calc(min(320px,52%) + env(safe-area-inset-right));padding-right:env(safe-area-inset-right);padding-bottom:0;border-top:0;border-left:1px solid var(--line);border-radius:16px 0 0 16px;
    box-shadow:-8px 0 28px rgba(0,0,0,.16);transform:translateX(104%)}
}
.iohelp{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.3);display:flex;align-items:flex-end;justify-content:center;padding:0 10px calc(10px + env(safe-area-inset-bottom))}
.iohelp[hidden]{display:none}
.iocard{background:#fff;border-radius:16px;padding:18px 18px 14px;width:min(420px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25);font-size:14px;line-height:1.55}
.iocard>b{font-size:16px}
.iocard ol{margin:10px 0 14px;padding-left:20px}
.iocard li{margin:6px 0}
.ioshare{display:inline-flex;align-items:center;gap:4px;color:#007aff;font-weight:600}
.ioshare i{display:inline-block;width:12px;height:14px;border:2px solid #007aff;border-top:0;border-radius:0 0 3px 3px;position:relative;margin-top:4px}
.ioshare i::before{content:"";position:absolute;left:3px;top:-8px;width:2px;height:11px;background:#007aff}
.ioshare i::after{content:"";position:absolute;left:1px;top:-9px;width:6px;height:6px;border-left:2px solid #007aff;border-top:2px solid #007aff;transform:rotate(45deg)}
.iocard .btn{width:100%;height:42px}
/* 키보드로 움직일 때만 파란 테두리 (마우스·손가락엔 안 보임) */
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #007aff;outline-offset:2px}
/* ───── 아이폰 느낌 (10-28): 떠 있는 단추는 반투명 유리 알약, 목록·창은 흰 카드 + 머리카락 선, 파란 글자 단추 ───── */
html,body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
:root{--bg:#eef1f4;--ink:#1c1c1e;--muted:#8e8e93;--line:rgba(60,60,67,.16);--work:#34c759;--move:#ff9f0a;--away:#aeaeb2;--blue:#007aff;--glass:rgba(255,255,255,.74)}
html body .chip,html body .sx-hb,html body .cx-btn,html body .listbtn,html body .testme,html body .pinbtn{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border:.5px solid rgba(0,0,0,.08);box-shadow:0 1px 1px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.08);border-radius:999px;color:var(--ink);font-weight:600;font-size:13px;padding:7px 13px;line-height:1.2}
html body .chip{padding:6px 11px;font-size:12.5px}
html body .sx-hb:active,html body .cx-btn:active,html body .listbtn:active,html body .btn:active,html body .cams button:active{transform:scale(.96)}
html body .sx-hb:hover,html body .cx-btn:hover,html body .listbtn:hover{background:rgba(255,255,255,.9)}
html body .cx-btn.dark{background:var(--ink);color:#fff}
html body .cx-gear{padding:7px 10px;margin-left:-4px}
html body .cx-toggle b{font-size:0;width:34px;height:20px;border-radius:20px;background:#e5e5ea;position:relative;display:inline-block;vertical-align:-5px;margin-left:8px;padding:0;transition:background .2s}

// 3D 로 바꾸지 않은 사람: 2D 그림을 세워 둔다 (카메라 쪽으로 돌고, 걸을 때 살짝 들썩인다)
const texLoader = new THREE.TextureLoader();
function makeStandee(name) {
  const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ transparent: true, alphaTest: 0.5, side: THREE.DoubleSide, visible: false });
  cutImage("../magnific/cut", STY.cut ?? STYLE_KEY, name).then((url) => texLoader.load(url, (tx) => {
    tx.colorSpace = THREE.SRGBColorSpace;
    mat.map = tx;
    mat.visible = true;
    mat.needsUpdate = true;
    card.scale.set(H * tx.image.width / tx.image.height, H, 1);
  }));
  const card = new THREE.Mesh(new THREE.PlaneGeometry(1, 1).translate(0, 0.5, 0), mat);
  card.castShadow = true;
  card.scale.set(H * 0.4, H, 1);
  g.add(card);
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.18 * H / 1.25, 20), new THREE.MeshBasicMaterial({ color: "#000", transparent: true, opacity: 0.18, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.005;
  g.add(shadow);
  return { wrap: g, card };
}

const STATUS_TEXT = { away: "출근 전", enter: "출근하는 중", work: "근무 중", leave: "퇴근하는 중", gone: "퇴근", trip: "잠깐 자리 비움", lunch: "점심 먹는 중", toLunch: "점심 먹으러 가는 중" };
const SPEED = 0.95 * (H / 1.25) ** 0.7; // 걷는 속도도 키에 맞춘다
const tmp = new THREE.Vector3();

class Person {
  constructor(name, idx) {
    this.name = name;
    this.idx = idx;
    this.seat = SEAT_BY_NO[SEAT_NO[idx]];
    this.c = models[idx];
    this.size = sizes[idx] || { drop: 0 };
    if (this.c) {
      this.head = this.c.root.getObjectByName("Head"); // 이름표 위치 (매 프레임 이름으로 찾지 않게)
      this.root = this.c.wrap;
      this.c.root.traverse((o) => { if (o.isMesh) o.userData.pid = idx; });
    } else {
      this.sd = makeStandee(name);
      this.root = this.sd.wrap;
      this.sd.card.userData.pid = idx;
    }
    scene.add(this.root);
    this.label = makeLabel(name);
    this.everLeft = false;
    this.setAway();
  }
  get status() { return this.state === "away" ? "away" : this.state === "work" ? "work" : "move"; }
  get statusText() {
    const md = PERSONAL.get(this.name)?.mode;
    if (MODES[md] && (AWAY_MODES.has(md) ? this.state === "away" : this.state === "work" || this.state === "workLeave")) return MODES[md][1];
    if (this.state === "away") return isLunch() && wantIn(this) ? STATUS_TEXT.lunch : this.everLeft ? STATUS_TEXT.gone : STATUS_TEXT.away;
    if (isLunch() && ["workLeave", "slideOut", "standUp", "pushChair", "leave"].includes(this.state)) return STATUS_TEXT.toLunch;
    if (this.state === "work" || this.state === "workLeave") return STATUS_TEXT.work;
    if (this.trip && this.state !== "leave") return STATUS_TEXT.trip;
    return ["leave", "slideOut", "standUp", "pushChair"].includes(this.state) ? STATUS_TEXT.leave : STATUS_TEXT.enter;
  }
  play(name, fade) { if (this.c) this.c.play(name, fade); }
  setAway() {
    this.trip = null;
    this.state = "away";
    this.root.visible = false;
    this.label.spr.visible = false;
    this.seat.chair.position.copy(this.seat.inPos);
    this.label.draw("away");
  }
  setWorking() {
    this.trip = null;
    const r = this.root;
    r.visible = true;
    this.label.spr.visible = true;
    if (this.c) {
      r.position.copy(this.seat.inPos);
      r.position.y = -this.size.drop;
      r.rotation.y = this.seat.rot;
      this.play("typing", 0);
      this.c.mixer.update(Math.random() * 5);
    } else {
      r.position.copy(this.seat.stand);
    }
    this.seat.chair.position.copy(this.seat.inPos);
    this.state = "work";
    this.label.draw("work");
  }
  arrive(delay = 0) {
    if (this.state !== "away") return;
    this.state = "wait";
    this.timer = delay;
    changed();
  }
  leave(delay = 0) {
    if (this.state !== "work") return;
    this.state = "workLeave";
    this.timer = delay;
    changed();
  }
  go(state) { this.state = state; this.timer = 0; }
  // 잠깐 자리 비우기: trip = { go: [자리 앞 → … → 목적지], face: 도착해서 볼 곳, stay: 머무는 초, partner?: 이야기 상대 }
  startTrip(trip) {
    if (this.state !== "work" || !this.c) return false;
    this.trip = trip;
    this.label.draw("move");
    this.go("slideOut");
    changed();
    return true;
  }
  walk(dt) {
    const r = this.root;
    let step = SPEED * dt;
    while (step > 0 && this.pi < this.path.length) {
      const d = tmp.copy(this.path[this.pi]).sub(r.position).setY(0);
      const len = d.length();
      if (len < 1e-4) { this.pi++; continue; }
      if (this.c) r.rotation.y = lerpAngle(r.rotation.y, Math.atan2(d.x, d.z), Math.min(1, dt * 8));
      if (len <= step) { r.position.x = this.path[this.pi].x; r.position.z = this.path[this.pi].z; step -= len; this.pi++; }
      else { r.position.addScaledVector(d, step / len); step = 0; }
    }
    this.phase = (this.phase || 0) + dt * 9;
    if (this.sd) this.sd.card.position.y = Math.abs(Math.sin(this.phase)) * 0.04 * H;
    return this.pi >= this.path.length;
  }
  update(dt) {
    if (this.chaos) return; // 어항 모드 이벤트가 조종하는 중
    const r = this.root, s = this.seat, sd = !this.c;
    switch (this.state) {
      case "away":
        return;
      case "wait":
        if ((this.timer -= dt) > 0) return;
        this.path = pathIn(s);
        if (sd) this.path[this.path.length - 1] = s.stand.clone();
        this.pi = 1;
        r.position.copy(this.path[0]);
        r.rotation.y = Math.PI / 2;
        r.visible = true;
        this.label.spr.visible = true;
        this.play("walk", 0.2);
        this.go("enter");
        this.label.draw("move");
        break;
      case "enter":
      case "leave":
        if (this.walk(dt)) {
          if (sd) {
            if (this.sd) this.sd.card.position.y = 0;
            if (this.state === "enter") { this.go("work"); this.label.draw("work"); changed(); }
            else { this.everLeft = true; this.setAway(); changed(); return; }
          } else if (this.state === "enter") { this.fromRot = r.rotation.y; this.play("idle", 0.3); this.go("pullChair"); }
          else { this.everLeft = true; this.setAway(); changed(); return; }
        }
        break;
      case "pullChair": { // 의자를 빼며 책상 쪽으로 돈다
        const k = Math.min((this.timer += dt) / 0.6, 1);
        s.chair.position.lerpVectors(s.inPos, s.outPos, ease(k));
        r.rotation.y = lerpAngle(this.fromRot, s.rot, ease(k)); // 책상 쪽을 보고 서면 의자는 뒤에 있다
        if (k >= 1) { this.go("sitDown"); this.play("sit_down", 0.25); }
        break;
      }
      case "sitDown": { // 앉는 동작(약 3초) 동안 의자 앞으로 옮기고, 발이 바닥에 닿게 몸을 내린다
        const a = this.c.actions.sit_down, dur = a.getClip().duration;
        const k = Math.min((this.timer += dt) / dur, 1);
        r.position.lerpVectors(s.approach, s.outPos, smooth(0, 0.45, k));
        r.position.y = -this.size.drop * smooth(0.35, 0.9, k);
        if (k >= 1) { this.go("slideIn"); this.play("typing", 0.5); }
        break;
      }
      case "slideIn": {
        const k = Math.min((this.timer += dt) / 0.6, 1);
        r.position.lerpVectors(s.outPos, s.inPos, ease(k));
        r.position.y = -this.size.drop;
        s.chair.position.set(r.position.x, 0, r.position.z);
        if (k >= 1) { this.go("work"); this.label.draw("work"); changed(); }
        break;
      }
      case "workLeave":
        if ((this.timer -= dt) <= 0) {
          this.label.draw("move");
          if (sd) { this.path = pathOut(s); this.path[0] = s.stand.clone(); this.pi = 1; this.go("leave"); }
          else this.go("slideOut");
          changed();
        }
        break;
      case "work":
        break;
      case "tripGo": // 목적지까지 걷기
        if (this.walk(dt)) { this.fromRot = r.rotation.y; this.play("idle", 0.3); this.go("tripStay"); this.trip.arrive?.(this); }
        break;
      case "tripStay": { // 목적지를 보고 잠깐 (이야기 상대가 있으면 번갈아 「…」)
        const t = this.trip, f = t.face;
        r.rotation.y = lerpAngle(this.fromRot, Math.atan2(f.x - r.position.x, f.z - r.position.z), ease(Math.min(this.timer / 0.5, 1)));
        this.timer += dt;
        if (t.partner) talkDots(this, t.partner, this.timer);
        if (this.timer < t.stay) break;
        talkDots(this, t.partner, -1);
        if (!shouldBeIn(this)) { // 그사이 퇴근을 눌렀거나 점심시간이 되면 자리로 안 가고 바로 나간다
          const end = t.go[t.go.length - 1], ax = t.go[t.go.length - 2].x;
          this.path = [end.clone(), v(ax, end.z), v(ax, MAIN_Z), DOOR_IN.clone(), DOOR_OUT.clone()];
          this.trip = null; this.pi = 1; this.play("walk", 0.3); this.go("leave"); changed();
          break;
        }
        this.path = t.go.map((p) => p.clone()).reverse();
        this.pi = 1; this.play("walk", 0.3); this.go("tripBack");
        break;
      }
      case "tripBack": // 자리로 돌아와 다시 앉는다 (출근해 들어올 때와 같은 동작)
        if (this.walk(dt)) { this.trip = null; this.fromRot = r.rotation.y; this.play("idle", 0.3); this.go("pullChair"); changed(); }
        break;
      case "slideOut": {
        const k = Math.min((this.timer += dt) / 0.6, 1);
        r.position.lerpVectors(s.inPos, s.outPos, ease(k));
        r.position.y = -this.size.drop;
        s.chair.position.set(r.position.x, 0, r.position.z);
        if (k >= 1) { this.go("standUp"); this.play("stand_up", 0.4); }
        break;
      }
      case "standUp": {
        const a = this.c.actions.stand_up, dur = a.getClip().duration;
        const k = Math.min((this.timer += dt) / dur, 1);
        r.position.y = -this.size.drop * (1 - smooth(0.05, 0.6, k));
        r.position.x = THREE.MathUtils.lerp(s.outPos.x, s.approach.x, smooth(0.55, 1, k));
        r.position.z = THREE.MathUtils.lerp(s.outPos.z, s.approach.z, smooth(0.55, 1, k));
        if (k >= 1) { this.play("idle", 0.3); this.go("pushChair"); }
        break;
      }
      case "pushChair": {
        const k = Math.min((this.timer += dt) / 0.5, 1);
        s.chair.position.lerpVectors(s.outPos, s.inPos, ease(k));
        if (k >= 1) {
          this.path = this.trip ? this.trip.go.map((p) => p.clone()) : pathOut(s);
          this.pi = 1; this.play("walk", 0.3); this.go(this.trip ? "tripGo" : "leave");
        }
        break;
      }
    }
  }
  placeLabel() {
    const r = this.root;
    if (this.c) {
      this.head.getWorldPosition(tmp);
      this.label.spr.position.set(tmp.x, tmp.y + 0.36 * H, tmp.z);
    } else this.label.spr.position.set(r.position.x, r.position.y + H * 1.12, r.position.z);
  }
}

function makeBubble() {
  // 살짝 볼록한 말풍선 (그림자·위쪽 반짝임·아래쪽 음영), 글씨는 이름표 크기를 따른다. 옆으로 넉넉하게 (한 줄에 많이)
  // 캔버스 크기는 늘 같게 (WebGL 텍스처는 처음 크기로 자리를 잡아 두므로, 크기를 바꿔 그리면 예전 그림이 남는다)
  const CW = 640, CH = 128;
  const c = document.createElement("canvas");
  c.width = CW;
  c.height = CH;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true, sizeAttenuation: false }));
  spr.renderOrder = 11;
  uiScene.add(spr);
  const b = { spr, text: "" };
  b.fit = () => { // 캔버스 1px = 이름표와 같은 화면 크기
    const f = labelF(), k = (0.1 / 256) * f;
    spr.scale.set(CW * k, CH * k, 1);
    spr.center.set(0.5, -(0.0281 * f * 0.42) / (CH * k)); // 아래 끝(꼬리)이 이름표 위에 닿게
  };
  b.set = (text, kind = "user") => {

    const auto = kind === "auto";
    const g = c.getContext("2d");

    tex.needsUpdate = true;

    g.font = auto ? "italic 500 27px Pretendard, 'Malgun Gothic', sans-serif" : "600 28px Pretendard, 'Malgun Gothic', sans-serif";
    // 띄어쓰기 단위로 줄바꿈 (한 낱말이 너무 길면 글자 단위), 두 줄까지 — 넘치면 끝에 …
    const MAXW = 540, fits = (t) => g.measureText(t).width <= MAXW, lines = [];
    let cur = "";

      for (const ch of word) { if (fits(cur + ch)) cur += ch; else { lines.push(cur); cur = ch; } }
    }

    const w = Math.min(CW - 20, Math.max(auto ? 96 : 110, Math.max(...lines.map((l) => g.measureText(l).width)) + (auto ? 52 : 64))), hb = (auto ? 16 : 22) + lines.length * 36;

    if (auto) { // 자동으로 나온 말: 옅은 회색 생각 구름 (알약 + 작은 동그라미 둘, 꼬리 없음)
      const r = Math.min(hb / 2, 28);

      g.fillStyle = "#6b6f76"; g.textAlign = "center"; g.textBaseline = "middle";

  const s = SEAT_BY_NO[no];
  const mk = new THREE.Mesh(MARK_GEO, MARK.free);
  mk.rotation.x = -Math.PI / 2;
  mk.position.set(s.center.x, 0.015, s.center.z);
  mk.visible = false;
  const tag = seatTag(no);
  tag.position.set(s.center.x, PH + 0.18 * H, s.center.z);
  tag.visible = false;
  scene.add(mk, tag);
  seatMarks[no] = { mk, tag };
}
function updateMarks() {
  const used = new Set(crew.map((m) => m.seat.no));
  for (const no of ALL_SEATS) {
    const { mk, tag } = seatMarks[no];
    mk.visible = editing;
    mk.material = no === hoverSeat ? MARK.hover : editSel?.seat.no === no ? MARK.sel : used.has(no) ? MARK.used : MARK.free;
    tag.visible = editing && (!used.has(no) || no === hoverSeat);
  }
}
// 마우스 아래 자리: 책상 높이쯤의 평면과 만나는 점에서 가장 가까운 자리
const seatPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -DH * 0.6), planeHit = new THREE.Vector3();
function seatUnderRay() {
  if (!ray.ray.intersectPlane(seatPlane, planeHit)) return null;
  let best = null, bd = 0.8;
  for (const no of ALL_SEATS) {
    const c = SEAT_BY_NO[no].center, d = Math.hypot(c.x - planeHit.x, c.z - planeHit.z);
    if (d < bd) { bd = d; best = no; }
  }
  return best;
}
// 의자 높이는 앉는 사람 몸에 맞춘다 (빈자리는 보통 높이)
function refitChairs() {
  const who = {};
  for (const m of crew) who[m.seat.no] = m;
  for (const no of ALL_SEATS) fitChair(SEAT_BY_NO[no].chair, who[no]?.size.seat ?? SEAT);
}
function place(m, no) {
  const wasIn = m.state !== "away";
  m.setAway();
  if (m.seat.on) setScreens(m.seat, false, simTime); // 비운 자리 모니터는 끈다
  m.seat = SEAT_BY_NO[no];
  SEAT_NO[m.idx] = no;
  if (m.name === FIG.owner) putFigure();
  refreshLeaves();
  if (wasIn) m.setWorking(); // 자리를 바꾸면 새 자리에 바로 앉아 있다
}
function moveTo(m, no) {
  if (!SEAT_BY_NO[no] || m.seat.no === no) return;
  const other = crew.find((o) => o !== m && o.seat.no === no), from = m.seat.no;
  place(m, no);
  if (other) place(other, from);
  refitChairs();
  noteChange();
}
function applyMap(map) {
  const target = assignSeats(map);
  crew.forEach((m, i) => moveTo(m, target[i])); // 한 명씩 제자리로 (바꿔 앉히기를 되풀이하면 모두 맞춰진다)
  noteChange();
}
function noteChange() {
  changed();
  updateMarks();
  const n = before ? crew.filter((m) => before[m.name] !== m.seat.no).length : 0;
  seatMsg.className = "msg warn";
  seatMsg.textContent = n ? `${n}명 자리가 바뀌었어요 · 「저장」해야 남아요` : "";
}
function pickForSeat(m) {
  editSel = editSel === m ? null : m;
  changed();
  updateMarks();
}
function seatClick(person) {
  // 고른 사람이 있으면: 누른 자리(빈자리·다른 사람 자리·다른 사람)로 옮기고 고르기를 끝낸다 → 다음 클릭은 새로 사람 고르기
  // 고른 사람이 없으면: 누른 사람(또는 누른 자리에 앉은 사람)을 고른다
  const no = person ? person.seat.no : seatUnderRay();
  if (no == null) return;
  const owner = person || crew.find((m) => m.seat.no === no);
  if (editSel && editSel !== owner) {
    const m = editSel;
    editSel = null;
    moveTo(m, no);
  } else if (owner) pickForSeat(owner);
}
// 「저장」: 이 브라우저가 기억한다 (다음에 열면 이 자리). 서버로 열었으면 seats.js 파일에도 쓴다
async function saveSeats() {
  savedAll = { ...savedAll, ...seatMap() }; // 다른 그림체에만 있는 사람 자리도 지킨다
  const data = { saved: new Date().toISOString(), seats: savedAll };
  let ok = false;
  try { localStorage.setItem(SEAT_KEY, JSON.stringify(data)); ok = true; } catch {}
  if (location.protocol.startsWith("http")) {
    try { await fetch("/__seats", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) }); } catch {}
  }
  before = seatMap();
  seatMsg.className = "msg" + (ok ? "" : " warn");
  seatMsg.textContent = ok ? "저장했어요 — 다음에 열어도 이 자리예요" : "저장하지 못했어요 (브라우저 저장소가 막혀 있어요)";
  return ok;
}
function setEditing(on) {
  if (!on && dirty()) {
    if (confirm("바꾼 자리를 저장할까요?\n(취소하면 바꾸기 전 자리로 돌아갑니다)")) saveSeats();
    else applyMap(before);
  }
  editing = on;
  editSel = null;
  hoverSeat = null;
  panelEl.classList.toggle("edit", on);
  seatBar.hidden = !on;
  seatBtn.textContent = on ? "자리 지정 끝내기" : "자리 지정";
  seatBtn.classList.toggle("dark", on);
  if (on) {
    before = seatMap();
    seatMsg.textContent = "";
    // 모두 자리에 앉혀서(안 보이는 사람 없이) 고르기 쉽게 — 끝내면 각자 누른 대로 돌아간다
    for (const m of crew) if (m.state !== "work") m.setWorking();
    selected = null;
    flyTo(HOME.target, HOME.pos); // 전체가 보이게
  }
  changed();
  updateMarks();
  if (!on) placeAttendance();
}
seatBtn.onclick = () => setEditing(!editing);
// 관리 도구(자리 지정은 자리 번호가 보인다)는 내 PC 에서 파일로 열 때만 — 구경용·실시간·claude.ai 판에선 ?admin 을 붙여도 안 나온다
document.getElementById("adminTools").hidden = !new URLSearchParams(location.search).has("admin") || DEMO || !!LIVE || IN_CLAUDE;

// ───────────── 화면 설정 (바닥 색 · 이름표) — 이 브라우저에 기억 ─────────────
const VIEW_KEY = "teamOfficeView";
const FLOORS = [PAL.floor, "#e6e7e8", "#cfd1d3", "#b1b4b7", "#8c9094", "#6a6e73"]; // 기본 + 밝은 회색 → 진한 회색
const VIEW_DEF = { floor: FLOORS[5], label: 60, labelOn: true }; // 사용자가 고른 기본값: 진한 회색 바닥 · 이름표 60%
const VIEW = { ...VIEW_DEF };
try { Object.assign(VIEW, JSON.parse(localStorage.getItem(VIEW_KEY)) || {}); } catch {}
const viewBar = document.getElementById("viewbar"), floorSw = document.getElementById("floorSw"), floorPick = document.getElementById("floorPick");
const labelSize = document.getElementById("labelSize"), labelSizeV = document.getElementById("labelSizeV"), labelOn = document.getElementById("labelOn");
const hex = (c) => "#" + new THREE.Color(c).getHexString();
function fitLabels() {
  const f = labelF();
  for (const m of crew) { m.label.spr.scale.set(0.1 * f, 0.0281 * f, 1); m.bubble?.fit(); }
}
floorSw.innerHTML = FLOORS.map((c, i) => `<button style="background:${c}" data-c="${c}" title="${i ? "회색" : "기본"}"></button>`).join("");
function applyView() {
  const old = floor.material.map;
  floor.material.map = floorTexture(VIEW.floor);
  floor.material.needsUpdate = true;
  old.dispose();
  fitLabels();
  labelSize.value = VIEW.label;
  labelSizeV.textContent = `${VIEW.label}%`;
  labelOn.checked = VIEW.labelOn;
  floorPick.value = hex(VIEW.floor);
  for (const b of floorSw.children) b.classList.toggle("on", hex(b.dataset.c) === hex(VIEW.floor));
  try { localStorage.setItem(VIEW_KEY, JSON.stringify(VIEW)); } catch {}
}
floorSw.onclick = (e) => { if (e.target.dataset.c) { VIEW.floor = e.target.dataset.c; applyView(); } };
floorPick.oninput = () => { VIEW.floor = floorPick.value; applyView(); };
labelSize.oninput = () => { VIEW.label = +labelSize.value; applyView(); };
labelOn.onchange = () => { VIEW.labelOn = labelOn.checked; applyView(); };
document.getElementById("viewReset").onclick = () => { Object.assign(VIEW, VIEW_DEF); applyView(); };
document.getElementById("viewEdit").onclick = (e) => {
  viewBar.hidden = !viewBar.hidden;
  e.target.classList.toggle("dark", !viewBar.hidden);
};
applyView();
document.getElementById("seatSave").onclick = saveSeats;
document.getElementById("seatCancel").onclick = () => { applyMap(before); seatMsg.textContent = ""; };
document.getElementById("seatReset").onclick = () => applyMap({});
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h);
  uiRenderer.setSize(w, h);
  const a = w / h;
  camera.aspect = a;
  // 좁은 화면(휴대폰 세로 등): 옆이 잘리지 않게 시야를 넓힌다 (가로 시야는 PC 와 비슷하게)
  camera.fov = a < 1.4 ? Math.min(80, (2 * Math.atan(Math.tan(Math.PI / 12) * 1.4 / a) * 180) / Math.PI) : 30;
  camera.updateProjectionMatrix();
  // 화면에 붙은 글씨(이름표·말풍선)는 시야를 넓힌 만큼 되돌리고, 폭이 좁으면 조금 작게 · 키가 낮으면(휴대폰 가로) 조금 크게
  const scr = (Math.tan((camera.fov * Math.PI) / 360) / Math.tan(Math.PI / 12)) * (a < 1 ? Math.min(1, Math.max(0.8, w / 1100)) : 1) * (h < 600 ? (600 / h) ** 0.9 : 1);
  if (Math.abs(scr - SCR) > 1e-3) { SCR = scr; fitLabels(); }
}
new ResizeObserver(resize).observe(stage);
resize();

// ───────────── 매 프레임 ─────────────
// 성능: 사람 동작은 화면에 보이는 사람만 매 프레임, 안 보이면 4프레임에 한 번 몰아서 갱신
const frustum = new THREE.Frustum(), pm = new THREE.Matrix4(), sph = new THREE.Sphere();
let frame = 0, simTime = 0, vidT = 0;
const perf = document.getElementById("perf");
let pf = 0, pacc = 0, fastSec = 0;
// 버벅이면 해상도를 낮추고(최소 1배 = 화면 그대로), 한동안 여유가 있으면 조금씩 되돌린다
let shadowEvery = 2; // 그림자를 다시 그리는 간격(프레임) — 해상도를 더 못 내리는 느린 기기면 늘린다 (휴대폰)
function adaptQuality(fps) {
  if (document.hidden) return;
  if (fps < 42) {
    fastSec = 0;
    if (dpr > DPR_MIN) { dpr = Math.max(DPR_MIN, +(dpr - 0.15).toFixed(2)); renderer.setPixelRatio(dpr); resize(); } // 정해 둔 밑으로는 안 내린다 (계단·지글거림·뿌연 글씨)
    else if (shadowEvery < 8) shadowEvery *= 2;
    return;
  }
  if (fps > 57) {
    if (++fastSec < 4) return;
    fastSec = 0;
    if (shadowEvery > 2) shadowEvery /= 2; // 여유가 생기면 그림자부터 되돌리고, 그다음 해상도
    else if (dpr < DPR_MAX) { dpr = Math.min(DPR_MAX, +(dpr + 0.1).toFixed(2)); renderer.setPixelRatio(dpr); resize(); }
    return;
  }
  fastSec = 0;
}
// 영상 화면은 초당 8번만 새로 그린다
function videoTick(dt) {
  if ((vidT += dt) < 0.125) return;
  vidT = 0;
  const live = [];
  for (let i = 0; i < tiles.length; i++) if (ScreenArt.ANIM.has(tiles[i].kind)) live.push(i);
  live.forEach((i, k) => paintTile(i, simTime, k === live.length - 1));
}
function step(dt) {
  frame++;
  simTime += dt;
  if (!CHAOS?.active) { attendTick(dt); tripTick(dt); fartTick(dt); }
  CHAOS?.tick(dt);
  CATS?.tick(dt);
  WX?.tick(dt);
  pm.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  frustum.setFromProjectionMatrix(pm);
  for (const m of crew) {
    m.update(dt);
    if (m.c && m.root.visible) {
      sph.set(m.root.position, H);
      m.acc = (m.acc || 0) + dt;
      if (m.frozen) m.acc = 0; // 얼음·낮잠: 동작 멈춤
      else if (frustum.intersectsSphere(sph) || frame % 4 === m.idx % 4) { m.c.mixer.update(m.acc); m.acc = 0; }
    }
    if (m.sd && m.root.visible) m.sd.card.rotation.y = Math.atan2(camera.position.x - m.root.position.x, camera.position.z - m.root.position.z);
    if (m.root.visible) m.placeLabel();
    if (!VIEW.labelOn) m.label.spr.visible = false;
    else if (m.root.visible) m.label.spr.visible = true;
    if (m.dots) {
      if (!m.root.visible) m.dots.visible = false;
      if (m.dots.visible) {
        const f = labelF();
        m.dots.scale.set(0.04 * f, 0.03 * f, 1);
        m.dots.center.set(-1.15, -0.05);
        m.dots.position.copy(m.label.spr.position);
      }
    }
    if (m.bubble) {
      m.bubble.spr.visible = m.root.visible && !!m.bubble.text;
      if (m.bubble.spr.visible) m.bubble.spr.position.copy(m.label.spr.position);
    }
    // 모니터: 앉아 있으면 켜고(무작위 화면), 일어나면 끈다. 일하는 동안 가끔 다른 화면으로
    const on = m.state === "work" || m.state === "workLeave", s = m.seat;
    if (s.on !== on) setScreens(s, on, simTime, m);
    else if (on && (s.swap -= dt) <= 0) {
      s.swap = 15 + Math.random() * 45;
      const free = [0, 1].filter((k) => !s.fixed?.[k] && s.tiles[k] != null); // 정해 둔 화면은 그대로
      if (!free.length) continue;
      const i = s.tiles[free[(Math.random() * free.length) | 0]];
      Object.assign(tiles[i], { kind: ScreenArt.pick(), seed: (Math.random() * 1e9) | 0 });
      paintTile(i, simTime);
    }
  }
  badgeTick();
  bgTick(dt);
  videoTick(dt);
  syncChairs();
  if (frame % shadowEvery === 0) renderer.shadowMap.needsUpdate = true;
  const near = crew.some((m) => m.root.visible && m.root.position.distanceTo(DOOR_IN) < 2.2 && Math.abs(m.root.position.z - DOOR.z) < 1.2);
  // 문: 목표 각도에 거의 닿으면 딱 맞춘다 (0 에 끝없이 다가가며 미세하게 움직이면 문틈이 깜박인다)
  const dDoor = (near ? 1.35 : 0) - doorPivot.rotation.y;
  doorPivot.rotation.y = Math.abs(dDoor) < 0.002 ? (near ? 1.35 : 0) : doorPivot.rotation.y + dDoor * Math.min(1, dt * 5);
  if (selected && selected.root.visible) {
    ring.visible = true;
    ring.position.set(selected.root.position.x, 0.012, selected.root.position.z);
  } else ring.visible = false;
  tourTick(dt);
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / 0.9);
    const k = ease(fly.t);
    controls.target.lerpVectors(fly.ft, fly.tt, k);
    camera.position.lerpVectors(fly.fp, fly.tp, k);
    if (fly.t >= 1) fly = null;
  }
  controls.update();
}
// 어항 모드 붙이기
// 한아린 책상 둘레의 고양이 두 마리 (자리를 옮기면 따라가지 않고 처음 자리 둘레에서 논다)
const catSeat = crew.find((m) => m.name === "한아린")?.seat;
const WALKING = new Set(["enter", "leave", "tripGo", "tripBack"]); // 걷는 중 (고양이가 알아채는 사람)
const CATS = window.OfficeCats && catSeat ? window.OfficeCats({ THREE, scene, uiScene, camera, seat: catSeat, aisleX: catSeat.aisleX, H, audio: () => audioCtx, scr: () => SCR,
  people: () => crew.filter((m) => m.root.visible && WALKING.has(m.state)).map((m) => ({ pos: m.root.position, moving: true, name: m.name })) }) : null;
const WX = window.OfficeWeather ? window.OfficeWeather({ THREE, scene, ROOM, renderer, camera, stage, hud: document.querySelector(".hud"), audio: () => audioCtx }) : null;
const CHAOS = AQUARIUM && window.Chaos ? window.Chaos({
  THREE, scene, camera, controls, renderer, office, crew, H, DH, PH, WALL_H, ROOM, DOOR_IN, DOOR_OUT, MAIN_Z, RCX,
  lights: { hemi, sun, fill }, stage, hud: document.querySelector(".hud"), flyTo,
  seats: () => Object.values(SEAT_BY_NO), snackSeats: () => [...SNACK_DESKS].map((n) => SEAT_BY_NO[n]).filter(Boolean),
  chairs: () => CHAIR_LIST, audio: () => audioCtx, setPaused: () => {}, restorePeople: () => placeAttendance(), live: !!LIVE,
  tour: TOUR, scr: () => SCR,
}) : null;
window.__chaos = CHAOS; // 점검용
const clock = new THREE.Clock();
if (WHO) select(WHO);
renderer.shadowMap.needsUpdate = true;
function frameLoop() { // 위젯 창으로 옮기면 그 창의 그리기 주기가 부른다
  const raw = clock.getDelta(), dt = Math.min(raw, 0.05);
  step(dt);
  renderer.render(scene, camera);
  if (pipWin) { renderer.autoClear = false; renderer.render(uiScene, camera); renderer.autoClear = true; } // 작은 창: 글씨도 3D 화면에 (두 번째 화면은 창 크기를 바꾸면 깨짐)
  else uiRenderer.render(uiScene, camera); // 글씨 층 (화면 해상도 그대로)
  atlasLive = true;
  pf++; pacc += raw;
  if (pacc > 1) {
    const fps = pf / pacc;
    adaptQuality(fps);
    perf.textContent = `${Math.round(fps)} fps · 해상도 ${dpr.toFixed(2)} · 그리기 ${renderer.info.render.calls} · 삼각형 ${(renderer.info.render.triangles / 1000).toFixed(0)}k`;
    pf = 0; pacc = 0;
  }
}
renderer.setAnimationLoop(frameLoop);
requestAnimationFrame(() => requestAnimationFrame(introDone)); // 첫 그림이 그려진 뒤에 시작 화면을 걷는다
// 점검용: 시간 빨리 돌리기 (미리보기 창이 뒤에 있으면 초당 1~2프레임이라)
window.__sim = (sec) => { for (let t = 0; t < sec; t += 1 / 30) step(1 / 30); renderer.shadowMap.needsUpdate = true; renderer.render(scene, camera); uiRenderer.render(uiScene, camera); atlasLive = true; };
window.__crew = crew;
window.__view = { camera, controls, flyTo, THREE, renderer, scene, uiScene, uiRenderer, render: () => { renderer.render(scene, camera); uiRenderer.render(uiScene, camera); } };
</script>
