<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>바 실시간 좌석</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html,body{margin:0;height:100%;background:#14100c;overflow:hidden;font-family:-apple-system,"Noto Sans KR",sans-serif}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none}
#ui{position:fixed;z-index:10;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px}
button{background:rgba(40,30,20,.85);color:#f3e3c8;border:1px solid #6b4a2a;border-radius:20px;padding:9px 14px;font-size:14px}
#hint{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;text-align:center;color:#c9b393;font-size:13px;line-height:1.5;text-shadow:0 1px 3px #000;pointer-events:none}
#splash{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:#fff;display:flex;align-items:center;justify-content:center;transition:opacity .7s ease;animation:spOut .6s 7s forwards}
@keyframes spOut{to{opacity:0;visibility:hidden}}
#splash .lgw{transition:transform .8s cubic-bezier(.5,0,.75,0)}
#splash svg{display:block;width:min(64vw,360px);height:auto;overflow:visible;animation:lgPop .9s 1.55s ease-in-out both}
#splash path{fill:#3e3b3a;fill-rule:evenodd;animation:lgIn .75s cubic-bezier(.2,.9,.25,1.2) both;animation-delay:calc(var(--i) * .15s + .2s)}
@keyframes lgIn{from{opacity:0;transform:translateY(var(--dy))}to{opacity:1;transform:none}}
@keyframes lgPop{45%{transform:scale(1.07)}100%{transform:scale(1)}}
#splash.out{opacity:0;pointer-events:none}
#splash.out .lgw{transform:scale(.85)}
@media (prefers-reduced-motion:reduce){#splash path{animation:none;opacity:1;transform:none}#splash svg{animation:none}}
#fx{position:fixed;top:0;left:0;right:0;bottom:0;z-index:5;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 52%,rgba(12,7,3,.45) 100%)}

 const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;const s=new T.Sprite(new T.SpriteMaterial({map:t,depthTest:false,toneMapped:false}));s.scale.set(.75,.15,1);s.position.set(x,y,z);s.renderOrder=9;scene.add(s)}
function pose(s,t){const B=s.B;s.base.forEach(([b,q])=>b.quaternion.copy(q));const F=s.fw,Lw=s.side,Rw=s.side.clone().negate();
 rotW(B.sp,Lw,.025*Math.sin(t*1.7));
 if(s.ch.act==='shake'){const up=.45+.22*Math.sin(t*14);
  aim(B.lu,D.clone().multiplyScalar(.75).addScaledVector(F,.55).addScaledVector(Lw,.18));aim(B.ru,D.clone().multiplyScalar(.75).addScaledVector(F,.55).addScaledVector(Rw,.18));
  aim(B.lf,F.clone().multiplyScalar(.8).addScaledVector(U,up).addScaledVector(Rw,.3));aim(B.rf,F.clone().multiplyScalar(.8).addScaledVector(U,up).addScaledVector(Lw,.3))}
 else{aim(B.lu,D.clone().addScaledVector(Lw,.15).addScaledVector(F,.06));aim(B.ru,D.clone().addScaledVector(Rw,.15).addScaledVector(F,.06));
  aim(B.lf,D.clone().addScaledVector(F,.28).addScaledVector(Lw,.05));aim(B.rf,D.clone().addScaledVector(F,.28).addScaledVector(Rw,.05));rotW(B.hd,U,.15*Math.sin(t*.35+s.ph))}}
CHARS.forEach((ch,ci)=>L.load(BASE+ch.file,gl=>{
 const m=gl.scene;
 m.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.isSkinnedMesh)o.frustumCulled=false;(Array.isArray(o.material)?o.material:[o.material]).forEach(mt=>{if(mt&&mt.isMeshStandardMaterial){mt.envMapIntensity=.55;if(mt.roughness<.5)mt.roughness=.6}})}});
 let bb=new T.Box3().setFromObject(m);const hh=(bb.max.y-bb.min.y)||1;m.scale.multiplyScalar(ch.h/hh);m.updateMatrixWorld(true);bb=new T.Box3().setFromObject(m);const c=bb.getCenter(V(0,0,0));
 const hold=new T.Group();m.position.x-=c.x;m.position.y-=bb.min.y;m.position.z-=c.z;hold.add(m);hold.position.set(ch.pos[0],ch.pos[1],ch.pos[2]);hold.rotation.y=ch.rot;scene.add(hold);hold.updateMatrixWorld(true);
 if(ch.act==='shake'){const old=scene.children.find(o=>o.isGroup&&o!==hold&&Math.abs(o.position.x+1.71)<.02&&Math.abs(o.position.z+4.95)<.02);if(old)scene.remove(old)}
 if(SHOW_LABELS)tag(ch.role+' · '+ch.file,ch.pos[0],ch.h+.28,ch.pos[2]);
 const s={ch,m,ph:ci*1.3,fw:V(Math.sin(ch.rot),0,Math.cos(ch.rot)),side:V(Math.cos(ch.rot),0,-Math.sin(ch.rot))};
 if(gl.animations&&gl.animations.length){s.mixer=new T.AnimationMixer(m);s.mixer.clipAction(gl.animations[0]).play()}
 else{s.B={lu:find(m,/left.*arm|arm.*left|upper.?arm.?l\b|\barm.?l\b|l.?upper.?arm/,/fore|hand|twist|lower/),ru:find(m,/right.*arm|arm.*right|upper.?arm.?r\b|\barm.?r\b|r.?upper.?arm/,/fore|hand|twist|lower/),
   lf:find(m,/left.*fore|fore.?arm.?l\b|lower.?arm.?l\b|l.?fore.?arm/),rf:find(m,/right.*fore|fore.?arm.?r\b|lower.?arm.?r\b|r.?fore.?arm/),sp:find(m,/spine/),hd:find(m,/head/,/end|top/)};
  s.base=[];m.traverse(o=>{if(o.isBone)s.base.push([o,o.quaternion.clone()])});
  if(!s.B.lu||!s.B.ru)toast(ch.file+': 팔 뼈대를 못 찾아서 T자세 그대로예요')}
 live.push(s);try{nf=0}catch(e){}
},undefined,()=>{if(onGH)toast(ch.file+' 불러오기 실패')}));
window.__anim=t=>{const dt=last?Math.min(.05,t-last):0;last=t;if(prev)prev(t);live.forEach(s=>{if(s.mixer)s.mixer.update(dt);else pose(s,t)})};
})();
// controls
let th=.5,ph=1.0,rad=9,tg=new T.Vector3(0,.8,-3.5);
const views={all:[.5,1.0,9,0,.8,-3.5],counter:[1.9,1.35,3.4,-.5,1.1,-4.5],door:[3.14,1.4,3.6,0,1.2,-6],top:[.3,.15,10,0,0,-4]};
let goal=null;
function setV(k){goal=views[k]}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>setV(b.dataset.v));
const pts=new Map();let last=0;
const el=renderer.domElement;
el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);goal=null;last=0};
el.onpointerup=el.onpointercancel=e=>pts.delete(e.pointerId);
el.onpointermove=e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);
 if(pts.size==1){th-=(e.clientX-p[0])*.008;ph=Math.min(1.5,Math.max(.1,ph-(e.clientY-p[1])*.008))}
 pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(pts.size==2){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(last)rad=Math.min(16,Math.max(1.5,rad*last/d));last=d}};
el.onwheel=e=>{e.preventDefault();rad=Math.min(16,Math.max(1.5,rad*(1+e.deltaY*.001)))};
let cw=0,ch=0,lk='',nf=0;
function resize(){const w=Math.max(innerWidth,document.documentElement.clientWidth,320),h=Math.max(innerHeight,document.documentElement.clientHeight,320);if(w==cw&&h==ch)return;cw=w;ch=h;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
function loop(){requestAnimationFrame(loop);resize();if(window.__anim){window.__anim(performance.now()/1000);nf=0}if(window.__fade)window.__fade();
 if(goal){th+=(goal[0]-th)*.06;ph+=(goal[1]-ph)*.06;rad+=(goal[2]-rad)*.06;tg.x+=(goal[3]-tg.x)*.06;tg.y+=(goal[4]-tg.y)*.06;tg.z+=(goal[5]-tg.z)*.06}
 cam.position.set(tg.x+rad*Math.sin(ph)*Math.sin(th),tg.y+rad*Math.cos(ph),tg.z+rad*Math.sin(ph)*Math.cos(th));
 const k=cam.position.x+','+cam.position.y+','+cam.position.z+','+cw+ch;if(k!==lk||nf<12){lk=k;nf++;cam.lookAt(tg);renderer.render(scene,cam);window.__ready=1}}
loop();
</script>
