<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAJEUX · 실시간 좌석</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html,body{margin:0;height:100%;background:#14100c;overflow:hidden;overscroll-behavior:none;font-family:-apple-system,"Noto Sans KR",sans-serif}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none}
body{color:#f4e9d6;--amber:#e7b56a;--ink:#f4e9d6;--mut:#b9a688;--panel:rgba(24,17,11,.68);--line:rgba(231,181,106,.2);--ok:#74e09a;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.glass{background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px) saturate(1.25);backdrop-filter:blur(14px) saturate(1.25);box-shadow:0 8px 28px rgba(0,0,0,.35)}
#menuBtn{position:fixed;z-index:11;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,calc(50% - 230px));display:flex;align-items:center;gap:8px;padding:8px 14px 8px 11px;border-radius:999px;font-size:14px;color:var(--ink);transition:background .25s,color .25s}
#menuBtn #mark2{display:flex;width:24px;height:20px;align-items:center}#menuBtn #mark2 svg{width:24px;height:auto;display:block}#menuBtn #mark2 path{fill:var(--amber);fill-rule:evenodd}
body.menu #menuBtn{background:var(--amber);color:#2a1a08;font-weight:600}body.menu #menuBtn #mark2 path{fill:#2a1a08}
#top{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 58px);left:10px;right:10px;max-width:460px;margin:0 auto;border-radius:18px;padding:10px 12px 11px;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);transform-origin:top left;pointer-events:none;transition:opacity .25s,transform .25s,visibility 0s .25s}
body.menu #top{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity .25s,transform .25s,visibility 0s}
#top .row{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0}
#mark{display:flex;width:26px;height:22px;align-items:center}#mark svg{width:26px;height:auto;display:block;animation:none}#mark path{fill:var(--amber);fill-rule:evenodd}
.wm{font-family:"Cormorant Garamond","Noto Serif KR",Georgia,serif;font-weight:600;font-size:21px;letter-spacing:.2em;line-height:1;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);padding:5px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:#8d7c62}.chip.live{color:#cfeeda}.chip.live i{background:var(--ok);box-shadow:0 0 0 0 rgba(116,224,154,.6);animation:pulse 2s infinite}.chip.wait i{background:#e7b56a}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(116,224,154,0)}100%{box-shadow:0 0 0 0 rgba(116,224,154,0)}}
#staff{font-size:12px;color:var(--mut);padding:5px 11px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
body.staff #staff{background:var(--amber);color:#2a1a08;border-color:var(--amber);font-weight:600}
#top .row2{display:flex;align-items:flex-end;gap:14px;margin-top:9px}
.cnt{display:flex;flex-direction:column;line-height:1;min-width:64px}.cnt small{font-size:11px;color:var(--mut);margin-bottom:5px}
.cnt b{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ok);letter-spacing:-.02em}.cnt b::after{content:"석";font-size:14px;font-weight:500;color:var(--ink);margin-left:3px}
.cnt em{font-style:normal;font-size:11px;color:var(--mut);margin-top:5px;white-space:nowrap}
#map{display:flex;gap:12px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.grp{display:flex;flex-direction:column;gap:3px}.gl{font-size:10.5px;color:var(--mut);letter-spacing:.02em}
.dots{display:flex}
.seat{width:21px;height:26px;display:flex;align-items:center;justify-content:center}
.seat::before{content:"";width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(116,224,154,.75);box-sizing:border-box;transition:background .3s,border-color .3s,transform .2s}
.seat.on::before{background:var(--amber);border-color:var(--amber);box-shadow:0 0 8px rgba(231,181,106,.55)}
.seat:active::before{transform:scale(.8)}
body.staff .seat::before{border-style:dashed}body.staff .seat.on::before{border-style:solid}
#hint{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 62px);left:0;right:0;text-align:center;color:#c9b393;font-size:13px;line-height:1.5;text-shadow:0 1px 3px #000;pointer-events:none}
#ui{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:2px;padding:4px;border-radius:999px;max-width:calc(100% - 20px)}
#ui button{padding:9px 15px;border-radius:999px;font-size:14px;color:var(--mut);white-space:nowrap;transition:background .25s,color .25s}
#ui button.on{background:var(--amber);color:#2a1a08;font-weight:600}
#ui .sep{width:1px;align-self:stretch;margin:7px 3px;background:var(--line)}
#ui button{padding:9px 13px}
#sbar{position:fixed;z-index:11;left:50%;transform:translate(-50%,8px);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);padding:7px 8px 7px 14px;border-radius:14px;font-size:12.5px;color:#cfeeda;border-color:rgba(116,224,154,.35);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
body.staff #sbar{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#sbar{display:flex;align-items:center;gap:10px}#sbar button{padding:5px 11px;border-radius:999px;border:1px solid rgba(116,224,154,.4);color:#cfeeda;font-size:12px}#sbar button:active{background:rgba(116,224,154,.2)}
#map{transition:box-shadow .3s,background .3s;border-radius:12px;padding:2px 4px}body.staff #map{background:rgba(231,181,106,.08);box-shadow:0 0 0 1px rgba(231,181,106,.35)}
body:not(.staff) .seat{cursor:default}
#toast{position:fixed;z-index:12;left:50%;transform:translate(-50%,6px);bottom:calc(env(safe-area-inset-bottom,0px) + 112px);padding:9px 15px;border-radius:14px;font-size:13px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#tip{position:fixed;z-index:9;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);text-align:center;font-size:12px;color:#d8c6a6;text-shadow:0 1px 4px #000;pointer-events:none;animation:tip 7s 3.2s both}
@keyframes tip{0%{opacity:0}12%,75%{opacity:.9}100%{opacity:0}}
#sheet{position:fixed;z-index:20;top:0;left:0;right:0;bottom:0;background:rgba(8,5,3,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
#sheet .box{width:100%;max-width:420px;margin:0 10px calc(env(safe-area-inset-bottom,0px) + 12px);border-radius:20px;padding:18px 16px 14px}
#sheet h2{margin:0 0 4px;font-size:17px;font-weight:600}#sheet p{margin:0 0 12px;font-size:12.5px;color:var(--mut)}
#sheet label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px}
#sheet input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
#lgMsg{min-height:18px;font-size:12.5px;color:#f0a08a;margin-top:8px}
#sheet .act{display:flex;gap:8px;margin-top:6px}#sheet .act button{flex:1;padding:12px;border-radius:12px;font-size:15px;border:1px solid var(--line)}
#sheet #lgOk{background:var(--amber);color:#2a1a08;border-color:var(--amber);font-weight:600}
@media (max-width:350px){.wm{font-size:18px}#ui button{padding:9px 11px;font-size:13px}.seat{width:19px}}
#sndBtn{position:fixed;z-index:11;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(10px,calc(50% - 230px));width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--amber);transition:color .25s}
#sndBtn .sl{display:none}#sndBtn.off .sl{display:block}#sndBtn.off .wv{display:none}#sndBtn.off{color:var(--mut)}
#sndBtn.wait{animation:snd 2.4s ease-in-out infinite}@keyframes snd{0%,100%{box-shadow:0 0 0 0 rgba(231,181,106,.0),0 8px 28px rgba(0,0,0,.35)}50%{box-shadow:0 0 0 6px rgba(231,181,106,.22),0 8px 28px rgba(0,0,0,.35)}}
#top .row3{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);min-height:16px}
.meter{flex:0 0 64px;height:5px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}.meter i{display:block;height:100%;width:0;border-radius:inherit;background:var(--ok);transition:width .7s cubic-bezier(.3,.8,.3,1),background .7s}
#crowdT{color:var(--ink);font-weight:600;white-space:nowrap}#updT{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#openT{margin-left:auto;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}#openT::before{content:"";width:6px;height:6px;border-radius:50%;background:#8d7c62}#openT.on{color:#cfeeda}#openT.on::before{background:var(--ok)}#openT[hidden]{display:none}
#top .row4{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ab{display:inline-flex;align-items:center;gap:6px;padding:7px 12px 7px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--ink);background:rgba(255,255,255,.035);transition:background .2s,border-color .2s}
.ab svg{width:15px;height:15px;stroke:var(--amber);flex:none}.ab:active{background:rgba(231,181,106,.16)}.ab[hidden]{display:none}
.ab.pri{background:var(--amber);color:#2a1a08;border-color:var(--amber);font-weight:600}.ab.pri svg{stroke:#2a1a08}
.ab[aria-pressed=true]{border-color:var(--ok);color:#cfeeda;background:rgba(116,224,154,.1)}.ab[aria-pressed=true] svg{stroke:var(--ok)}
.sh{position:fixed;z-index:20;top:0;left:0;right:0;bottom:0;background:rgba(8,5,3,.5);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .22s}
.sh.in{opacity:1}.sh[hidden]{display:none}
.sh .box{width:100%;max-width:440px;margin:0 10px calc(env(safe-area-inset-bottom,0px) + 12px);border-radius:22px;padding:16px 14px 14px;transform:translateY(24px);transition:transform .28s cubic-bezier(.2,.9,.3,1);box-sizing:border-box;max-height:calc(100% - 40px);display:flex;flex-direction:column}
.sh.in .box{transform:none}
.sh .hd{display:flex;align-items:flex-start;gap:10px;padding:0 4px 4px}.sh .hd>div{flex:1;min-width:0}
.sh h2{margin:0 0 3px;font-size:17px;font-weight:600}.sh p{margin:0;font-size:12.5px;color:var(--mut);line-height:1.45}
.sh .x{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);font-size:13px;color:var(--mut)}
.sh .wide{display:block;width:100%;margin-top:10px;padding:12px;border-radius:14px;background:var(--amber);color:#2a1a08;font-weight:600;font-size:15px;text-align:center;text-decoration:none;box-sizing:border-box}
#dkList{overflow:auto;margin:6px -6px 0;padding:0 6px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.dk-g{font-size:11px;color:var(--mut);letter-spacing:.06em;margin:12px 6px 4px}
.dk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 8px;border-radius:14px;border:1px solid transparent;transition:background .2s}
.dk:hover{background:rgba(231,181,106,.07)}.dk:active{background:rgba(231,181,106,.14)}
.dk .sw{flex:0 0 30px;height:30px;border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.6),rgba(255,255,255,0) 42%),var(--c);box-shadow:inset 0 -4px 7px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.14),0 0 14px -2px var(--c)}
.dk .tx{flex:1;min-width:0}.dk b{display:block;font-size:14.5px;font-weight:600}.dk b small{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;color:var(--mut);font-size:13px;margin-left:6px;letter-spacing:.02em}
.dk .tx span{display:block;font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk em{flex:none;font-style:normal;font-size:12px;color:var(--amber);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
#ifBody{overflow:auto;margin-top:8px}
.ifr{display:flex;gap:12px;padding:11px 4px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5}.ifr>small{flex:0 0 52px;color:var(--mut);font-size:12px;padding-top:1px}.ifr>div{flex:1;min-width:0}
.hrs{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-variant-numeric:tabular-nums}.hrs .td{color:var(--amber);font-weight:600}
.lk{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.lk a{font-size:12px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px}
#shotImg{display:block;width:100%;max-height:52vh;object-fit:contain;border-radius:12px;margin-top:10px;background:#000}
#shot .act{display:flex}
#ordP{position:fixed;z-index:11;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translate(-50%,8px);display:flex;align-items:center;gap:9px;padding:8px 15px 8px 12px;border-radius:999px;font-size:13px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
#ordP.show{opacity:1;transform:translate(-50%,0)}body.staff #ordP{bottom:calc(env(safe-area-inset-bottom,0px) + 116px)}
#ordP .sp{width:14px;height:14px;border-radius:50%;border:2px solid rgba(231,181,106,.3);border-top-color:var(--amber);animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#flash{position:fixed;z-index:30;top:0;left:0;right:0;bottom:0;background:#fff;opacity:0;pointer-events:none}#flash.on{animation:fl .5s ease-out}@keyframes fl{0%{opacity:.85}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.sh,.sh .box{transition:none}#ordP .sp{animation:none}#flash.on{animation:none}}
#ver{position:fixed;z-index:5;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);font-size:10px;letter-spacing:.04em;color:rgba(255,255,255,.4);pointer-events:none}
body.menu #hint{top:var(--hintTop,calc(env(safe-area-inset-top,0px) + 330px))}
@media (prefers-reduced-motion:reduce){.chip.live i,#tip{animation:none}#top{transition:none}#sndBtn.wait{animation:none}}
#splash{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:#fff;display:flex;align-items:center;justify-content:center;transition:opacity .7s ease;animation:spOut .6s 7s forwards}
@keyframes spOut{to{opacity:0;visibility:hidden}}
#splash .lgw{transition:transform .8s cubic-bezier(.5,0,.75,0)}
#splash svg{display:block;width:min(64vw,360px);height:auto;overflow:visible;animation:lgPop .9s 1.55s ease-in-out both}
#splash path{fill:#3e3b3a;fill-rule:evenodd;animation:lgIn .75s cubic-bezier(.2,.9,.25,1.2) both;animation-delay:calc(var(--i) * .15s + .2s)}
@keyframes lgIn{from{opacity:0;transform:translateY(var(--dy))}to{opacity:1;transform:none}}
@keyframes lgPop{45%{transform:scale(1.07)}100%{transform:scale(1)}}
#splash.out{opacity:0;pointer-events:none}
#splash.out .lgw{transform:scale(.85)}
@media (prefers-reduced-motion:reduce){#splash path{animation:none;opacity:1;transform:none}#splash svg{animation:none}}

// the street crowd is one mesh placed in its vertex shader: give it the street's bounds so it is skipped whenever the street is out of view
try{const C=G&&G.crowd&&G.crowd.mesh;if(C&&!C.frustumCulled){C.geometry.boundingSphere=new T.Sphere(new T.Vector3(0,1,7.6),48.5);C.frustumCulled=true;INFO.crowdCull=1}}catch(e){}

// ---------- 2. shadows
const SL=[];scene.traverse(o=>{if(o.isLight&&o.castShadow&&o.shadow)SL.push(o)});
const LEVEL=SL.length>=2&&!X.shadowPairs;if(LEVEL)SL.forEach(l=>{l.shadow.autoUpdate=false;l.shadow.needsUpdate=true});INFO.shadowLights=SL.length;

// ---------- 3. compile everything once, off the main thread where the browser can
function precompile(){if(INFO.pre!=null)return;INFO.pre=0;
 try{const gl=renderer.getContext(),ext=renderer.extensions.get('KHR_parallel_shader_compile'),n0=renderer.info.programs.length,ck=renderer.debug.checkShaderErrors,prev=renderer.getRenderTarget();

  try{renderer.compile(scene,cam)}finally{renderer.setRenderTarget(prev);renderer.debug.checkShaderErrors=ck;rt.dispose()}

  const done=p=>{if(p.diagnostics)return true;if(!p.program)return true;if(ext&&!gl.getProgramParameter(p.program,ext.COMPLETION_STATUS_KHR))return false;
   const ok=!!gl.getProgramParameter(p.program,gl.LINK_STATUS);p.diagnostics={runnable:ok,programLog:ok?'':String(gl.getProgramInfoLog(p.program)||''),vertexShader:{log:'',prefix:''},fragmentShader:{log:'',prefix:''}};
   if(!ok){INFO.preFail=(INFO.preFail||0)+1;console.warn('program link failed (precompile)')}return true};
  let left=L.slice(),tries=0;const poll=()=>{left=left.filter(p=>!done(p));if(left.length&&++tries<600)setTimeout(poll,ext?120:400);else INFO.preLeft=left.length};setTimeout(poll,ext?200:1500);
 }catch(e){INFO.preErr=String(e&&e.message)}}

// ---------- 4. resolution
const PR0=renderer.getPixelRatio(),FLOOR=Math.max(.75,PR0*.55),STEP=.84;let pr=PR0;
let PX=null;const pxU=()=>{if(PX)return PX;PX=[];const seen=new Set();scene.traverse(o=>{const m=o.material;if(!m||Array.isArray(m)||seen.has(m))return;seen.add(m);
  if(m.uniforms&&m.uniforms.px&&typeof m.uniforms.px.value==='number'&&Math.abs(m.uniforms.px.value-PR0)<1e-3)PX.push(m.uniforms.px)});return PX};
function setPR(p){p=Math.max(FLOOR,Math.min(PR0,p));if(Math.abs(p-pr)<.01)return false;pr=p;renderer.setPixelRatio(p);pxU().forEach(u=>u.value=p);INFO.pr=+p.toFixed(3);INFO.changes=(INFO.changes||0)+1;return true}
const AUTO=!X.noAuto&&!X.noPR;let last=0,ema=0,st='run',t0=0,e0=0,prev=PR0,slowT=0,goodT=0,wait=8000,lock=0,refr=16.7;const IV=[];
function ctl(now){if(!AUTO)return;if(!last){last=now;return}const d=now-last;last=now;if(document.hidden||d<=0||d>250)return;
 if(!readyAt)return;if(now-readyAt<6000){IV.push(d);return}
 if(IV.length){IV.sort((a,b)=>a-b);refr=Math.max(6.5,Math.min(34,IV[Math.floor(IV.length*.15)]||16.7));IV.length=0;INFO.refresh=+refr.toFixed(1);ema=refr}
 ema+=(d-ema)*.08;const slow=Math.max(19.5,refr*1.3),good=Math.max(refr*1.15,Math.min(slow-1,refr+2.2));INFO.ema=+ema.toFixed(1);
 if(st==='check'){if(now-t0>1600){st='run';if(ema>e0*.94){setPR(prev);lock=now+40000;INFO.cpuBound=(INFO.cpuBound||0)+1}}return}
 if(st==='probe'){if(now-t0>2600){st='run';if(ema>slow){setPR(prev);wait=Math.min(64000,wait*2)}else wait=8000}return}
 slowT=ema>slow?slowT+d:Math.max(0,slowT-d*.5);goodT=ema<good?goodT+d:0;
 if(slowT>1200&&now>lock&&pr>FLOOR+.01){e0=ema;prev=pr;if(setPR(pr*STEP)){st='check';t0=now;slowT=0;goodT=0}return}
 if(goodT>wait&&pr<PR0-.01){prev=pr;if(setPR(Math.min(PR0,pr/STEP))){st='probe';t0=now;goodT=0}}}
window.__prSet=p=>{setPR(p);return renderer.getPixelRatio()};

// ---------- per frame
const P0=POST.render;
POST.render=function(){fr++;if(!readyAt&&window.__ready)readyAt=performance.now();
 if(LEVEL){renderer.shadowMap.needsUpdate=true;SL[fr%SL.length].shadow.needsUpdate=true}
 try{ctl(performance.now())}catch(e){}
 if(INFO.pre==null&&readyAt&&performance.now()-readyAt>(X.preAt||4200)&&!X.noPre)precompile();
 return P0.apply(this,arguments)};
INFO.ok=1;
})();

renderer.shadowMap.autoUpdate=false;let shF=0;
function loop(){requestAnimationFrame(loop);if((shF++&1)===0)renderer.shadowMap.needsUpdate=true;if(document.hidden)return;resize();const now=performance.now()/1000,dt=Math.min(.05,ltm?now-ltm:0);ltm=now;
 if(window.__anim)window.__anim(now);CUST.tick(now,dt,Object.values(AV));CUST.tickBar(BARMAN,now,dt);if(window.__fx)window.__fx(now,dt);if(window.__fade)window.__fade();
 if(tour){tourT+=dt;const u=(tourT%8)/8,g0=TOUR[Math.floor(tourT/8)%TOUR.length]();g0[0]+=.3*(u-.5);goal=g0;near()}
 if(goal){const k=1-Math.exp(-dt*(tour?1.3:3.6));th+=(goal[0]-th)*k;ph+=(goal[1]-ph)*k;rad+=(goal[2]-rad)*k;tg.x+=(goal[3]-tg.x)*k;tg.y+=(goal[4]-tg.y)*k;tg.z+=(goal[5]-tg.z)*k}
 else if(!pts.size){th+=vth;ph=cph(ph+vph);vth*=.92;vph*=.92;idle+=dt;if(idle>9)th+=dt*.03*Math.sin((now)*.11)}
 if(staff)markers.forEach((m,i)=>{m.material.opacity=.55+.45*Math.sin(now*3+i)});
 if(!(window.__cam&&window.__cam(now,dt))){cam.position.set(tg.x+rad*Math.sin(ph)*Math.sin(th),tg.y+rad*Math.cos(ph),tg.z+rad*Math.sin(ph)*Math.cos(th));cam.lookAt(tg)}if(window.G51&&window.G51.tick)window.G51.tick(now,dt);POST.render(scene,cam);window.__ready=1;if(window.__frame)window.__frame(now,dt)}
loop();
