<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EXTREME OCEAN SURVIVAL</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
  /* a game, not a document: no text on it can be selected, copied or dragged, and a long press brings up no menu */
  *, *::before, *::after { -webkit-user-select: none !important; -moz-user-select: none !important; user-select: none !important; -webkit-touch-callout: none !important; -webkit-tap-highlight-color: transparent; -webkit-user-drag: none; }
  ::selection { background: transparent; color: inherit; }
  body { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; color: #dfe6ea; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; user-select: none; }
  #load { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #04070a; transition: opacity .7s ease; pointer-events: none; }
  #load .lt { font-weight: 200; letter-spacing: .34em; font-size: clamp(15px, 2vw, 24px); color: #e9eef1; margin-bottom: 30px; text-align: center; line-height: 1.6; }
  #load .lb { width: min(320px, 62vw); height: 2px; background: rgba(255,255,255,.14); }
  #load .lb i { display: block; height: 100%; width: 0; background: #e9eef1; }
  #load .lp { margin-top: 14px; font-size: 11px; letter-spacing: .3em; color: rgba(225,233,238,.5); }
  #fatal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 40px; font-size: 15px; line-height: 1.7; color: #c9d2d8; background: #05080b; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui"></div>
<div id="fatal"></div>
<div id="load"><div class="lt">EXTREME<br>OCEAN SURVIVAL</div><div class="lb"><i id="loadbar"></i></div><div class="lp" id="loadpct">0%</div></div>
<script>
// The loading bar. The game says how far it has really got (window.__load(0..1): the bytes of each model as they come
// in, then unpacking them); the bar eases toward that and never jumps, and the number counts up with it. Until the
// game itself has arrived (it cannot report its own coming) the bar creeps over the first few per cent.
(function () {
  var l = document.getElementById("load"), bar = document.getElementById("loadbar"), pct = document.getElementById("loadpct");
  var target = 0, shown = 0, heard = false, end = false, fading = false, t0 = performance.now(), last = t0;
  function frame(now) {
    // (a frame after the page has stood still - the graphics card readying shaders - counts as one frame, not the time
    // stood still: the bar carries on from where it was instead of leaping)
    var dt = Math.min(1 / 30, Math.max(0, (now - last) / 1000)); last = now;
    if (!heard) target = Math.max(target, 0.05 * (1 - Math.exp(-(now - t0) / 1200)));
    var gap = target - shown;
    // (eased, and never faster than 60 % of the bar a second - 2 % a frame - or 100 % once everything is in, so nobody
    // waits on it; more than half the loading is the page standing still, and slower than this the bar fell so far
    // behind that it kept everyone waiting a second and a half after the game was ready)
    if (gap > 0) shown += Math.min(gap, Math.max(gap * (1 - Math.exp(-dt * 5)), 0.03 * dt), (end ? 1.0 : 0.6) * dt);
    if (end && shown > 0.9999) shown = 1;
    bar.style.width = (shown * 100).toFixed(2) + "%";
    pct.textContent = Math.floor(shown * 100 + 1e-6) + "%";
    if (end && shown >= 1) {
      if (!fading) { fading = true; setTimeout(function () { l.style.opacity = "0"; setTimeout(function () { l.style.display = "none"; }, 800); }, 250); }
      return;
    }
    requestAnimationFrame(frame);
  }
  // how far the bar is behind what the game has done (the game lets it catch up before the page stands still again)
  window.__loadLag = function () { return end ? 0 : Math.max(0, target - shown); };
  window.__load = function (p) {
    if (!l || end) return;
    heard = true; p = Math.max(0, Math.min(1, p));
    if (p > target) target = p;
    if (p >= 1) end = true;
  };
  if (l) requestAnimationFrame(frame);
})();
</script>
<script>
// Long presses and double taps on a phone must never select or copy the game's labels, or open the browser's menu.
(function () {
  var stop = function (e) { e.preventDefault(); };
  ['selectstart', 'dragstart', 'copy', 'cut', 'gesturestart', 'gesturechange'].forEach(function (t) { document.addEventListener(t, stop, { capture: true, passive: false }); });
  document.addEventListener('contextmenu', function (e) { if (!(e.target && e.target.closest && e.target.closest('a[href]'))) e.preventDefault(); }, { capture: true });
  document.addEventListener('selectionchange', function () { var s = window.getSelection && window.getSelection(); if (s && !s.isCollapsed) s.removeAllRanges(); });
  // a second tap landing on the same spot must not zoom the page or pick a word
  var last = 0;
  // (not on the menu's own rows: tapping those quickly is how a setting is stepped through)
  document.addEventListener('touchend', function (e) { var now = Date.now(), menu = e.target && e.target.closest && e.target.closest('.act'); if (!menu && now - last < 350 && e.cancelable) e.preventDefault(); last = now; }, { capture: true, passive: false });
})();
</script>
<script>(function(){var s=document.createElement("script");s.src="dist/game.js?t="+Math.floor(Date.now()/60000);document.body.appendChild(s);})();</script>
</body>
</html>
